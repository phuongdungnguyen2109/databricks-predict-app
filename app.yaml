command: ["python", "-u", "surge_dashboard_app.py"]

env:
  - name: "DATABRICKS_WAREHOUSE_ID"
    valueFrom: "sql_warehouse"
  - name: "DATABRICKS_TOKEN"
    valueFrom: "model_pat_secret"

resources:
  sql_warehouse:
    name: "Serverless Starter Warehouse"
    warehouse:
      id: "bda20b54525e3c76"
      permission: "CAN_USE"

  model_pat_secret:
    name: "model_pat_secret"
    secret:
      scope: "ckbigdata-secrets"
      key: "model-pat"
      permission: "READ"
